name: Backend quality
on:
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']
  push:
    branches: ['feat/biblia-backend']
    paths: ['backend/**', '.github/workflows/backend.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
        env:
          POSTGRES_DB: biblia_test
          POSTGRES_USER: biblia_test
          # Only the disposable GitHub runner service; never use trust in local/deployed databases.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432/tcp']
        options: >-
          --health-cmd "pg_isready -U biblia_test -d biblia_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://biblia_test@127.0.0.1:${{ job.services.postgres.ports[5432] }}/biblia_test?schema=app
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund --strict-peer-deps
      - run: npm run prisma:generate
      - run: npm run db:migrate:test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:tooling
      - run: npm run test:coverage
      - run: npm run test:mutation
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-quality
          path: backend/reports/
          if-no-files-found: warn
          retention-days: 14
