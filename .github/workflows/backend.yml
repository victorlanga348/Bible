name: Backend quality
on:
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']
  push:
    branches: ['feat/biblia-backend']
    paths: ['backend/**', '.github/workflows/backend.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  foundation:
    runs-on: ubuntu-24.04
    # Regular tests/coverage run once; isolated mutation partitions follow.
    timeout-minutes: 360
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-bookworm@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_DB: biblia_test
          POSTGRES_USER: biblia_test
          # Only the disposable GitHub runner service; never use trust in local/deployed databases.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432/tcp']
        options: >-
          --health-cmd "pg_isready -U biblia_test -d biblia_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      NODE_ENV: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Configure isolated test database
        shell: bash
        run: |
          printf '%s\n' "TEST_DATABASE_URL=postgresql://biblia_test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/biblia_test?schema=app" >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts --no-audit --no-fund --strict-peer-deps
      - run: npm run prisma:generate
      - name: Provision admitted biblical corpus
        shell: bash
        run: |
          set -euo pipefail
          directory=data/biblical-canon/porbr2018
          mkdir -p "$directory"
          original="$(mktemp "$directory/source.zip.XXXXXX")"
          trap 'rm -f "$original"' EXIT
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --connect-timeout 10 --max-time 120 --retry 2 --output "$original" 'https://ebible.org/Scriptures/porbr2018_vpl.zip'
          printf '%s  %s\n' '1f71b7765795ae7cc416a9255c7d9c3a3932ce868206fa762606c7438c8fc682' "$original" | sha256sum --check --status
          mv "$original" "$directory/source.zip"
          python3 scripts/prepare-canon.py
      - name: Provision admitted source original
        shell: bash
        run: |
          set -euo pipefail
          directory=data/source-library/josephus-antiquities-pg2848-en
          mkdir -p "$directory"
          original="$(mktemp "$directory/source.html.XXXXXX")"
          trap 'rm -f "$original"' EXIT
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --connect-timeout 10 --max-time 120 --retry 2 --output "$original" 'https://www.gutenberg.org/files/2848/2848-h/2848-h.htm'
          printf '%s  %s\n' '098d837010fea0f38b104d2c9397696ae5db9e5cbd15a8e8f400f36811fbcf99' "$original" | sha256sum --check --status
          mv "$original" "$directory/source.html"
          notice="$(mktemp "$directory/source.txt.XXXXXX")"
          trap 'rm -f "$original" "$notice"' EXIT
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --connect-timeout 10 --max-time 120 --retry 2 --output "$notice" 'https://www.gutenberg.org/cache/epub/2848/pg2848.txt'
          printf '%s  %s\n' 'bb2e32da8ba3adc109b7694e6a8f2f11570462af2bedd55798da70b754c6e440' "$notice" | sha256sum --check --status
          mv "$notice" "$directory/source.txt"
          python3 scripts/prepare-sources.py "$directory/source.html" "$directory/source.txt" "$directory/operational"
      - run: npm run db:migrate:test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:tooling
      - run: npm run test:coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-quality
          path: backend/reports/
          if-no-files-found: warn
          retention-days: 14
  mutation:
    needs: foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-bookworm@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_DB: biblia_test
          POSTGRES_USER: biblia_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432/tcp']
        options: >-
          --health-cmd "pg_isready -U biblia_test -d biblia_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      NODE_ENV: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Configure isolated test database
        shell: bash
        run: |
          printf '%s\n' "TEST_DATABASE_URL=postgresql://biblia_test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/biblia_test?schema=app" >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts --no-audit --no-fund --strict-peer-deps
      - run: npm run prisma:generate
      - name: Provision admitted biblical corpus
        shell: bash
        run: |
          set -euo pipefail
          directory=data/biblical-canon/porbr2018
          mkdir -p "$directory"
          original="$(mktemp "$directory/source.zip.XXXXXX")"
          trap 'rm -f "$original"' EXIT
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --connect-timeout 10 --max-time 120 --retry 2 --output "$original" 'https://ebible.org/Scriptures/porbr2018_vpl.zip'
          printf '%s  %s\n' '1f71b7765795ae7cc416a9255c7d9c3a3932ce868206fa762606c7438c8fc682' "$original" | sha256sum --check --status
          mv "$original" "$directory/source.zip"
          python3 scripts/prepare-canon.py
      - name: Provision admitted source original
        shell: bash
        run: |
          set -euo pipefail
          directory=data/source-library/josephus-antiquities-pg2848-en
          mkdir -p "$directory"
          original="$(mktemp "$directory/source.html.XXXXXX")"
          notice="$(mktemp "$directory/source.txt.XXXXXX")"
          trap 'rm -f "$original" "$notice"' EXIT
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --connect-timeout 10 --max-time 120 --retry 2 --output "$original" 'https://www.gutenberg.org/files/2848/2848-h/2848-h.htm'
          printf '%s  %s\n' '098d837010fea0f38b104d2c9397696ae5db9e5cbd15a8e8f400f36811fbcf99' "$original" | sha256sum --check --status
          mv "$original" "$directory/source.html"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --connect-timeout 10 --max-time 120 --retry 2 --output "$notice" 'https://www.gutenberg.org/cache/epub/2848/pg2848.txt'
          printf '%s  %s\n' 'bb2e32da8ba3adc109b7694e6a8f2f11570462af2bedd55798da70b754c6e440' "$notice" | sha256sum --check --status
          mv "$notice" "$directory/source.txt"
          python3 scripts/prepare-sources.py "$directory/source.html" "$directory/source.txt" "$directory/operational"
      - run: npm run db:migrate:test
      - name: Restore mutation analysis
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: backend/reports/mutation/incremental.json
          key: mutation-shard-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('backend/package-lock.json', 'backend/jest*.cjs', 'backend/tsconfig*.json', 'backend/stryker.config.json', 'backend/scripts/mutation-shards.cjs', 'backend/test/setup.cjs', 'backend/test/mutation-database-setup.ts', 'backend/test/helpers/**') }}-${{ github.sha }}
          restore-keys: |
            mutation-shard-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('backend/package-lock.json', 'backend/jest*.cjs', 'backend/tsconfig*.json', 'backend/stryker.config.json', 'backend/scripts/mutation-shards.cjs', 'backend/test/setup.cjs', 'backend/test/mutation-database-setup.ts', 'backend/test/helpers/**') }}-
            ${{ hashFiles('backend/package-lock.json', 'backend/jest*.cjs', 'backend/tsconfig*.json', 'backend/stryker.config.json', 'backend/test/setup.cjs', 'backend/test/mutation-database-setup.ts', 'backend/test/helpers/**') == 'c7420005bea1082056d977d24a68d0a692bba7894feb84765629e0aaddc3f9a2' && format('mutation-shard-{0}-{1}-c409ac88f6ae8eca8703565c382dc80169d4b62c2f7dea0b7a54184c86572a94-429c5bcc318209b1fc8b3761a75d6a2561a8ee1a', matrix.shard, runner.os) || 'no-compatible-429-mutation-cache' }}
            ${{ hashFiles('backend/package-lock.json', 'backend/jest*.cjs', 'backend/tsconfig*.json', 'backend/stryker.config.json', 'backend/test/setup.cjs', 'backend/test/mutation-database-setup.ts', 'backend/test/helpers/**') == 'c7420005bea1082056d977d24a68d0a692bba7894feb84765629e0aaddc3f9a2' && format('mutation-shard-{0}-{1}-6fa37e898c7610ab6f1979acd7ef4e599f5564c9f53459068533f43d054a55c5-9d50bbb5b8274d1e846998b66530d026e14a1ef4', matrix.shard, runner.os) || 'no-compatible-9d50-mutation-cache' }}
      - name: Seed compatible analysis from the completed checkpoint when no cache exists
        if: hashFiles('backend/reports/mutation/incremental.json') == '' && hashFiles('backend/package-lock.json', 'backend/jest*.cjs', 'backend/tsconfig*.json', 'backend/stryker.config.json', 'backend/test/setup.cjs', 'backend/test/mutation-database-setup.ts', 'backend/test/helpers/**') == 'c7420005bea1082056d977d24a68d0a692bba7894feb84765629e0aaddc3f9a2'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: mutation-${{ matrix.shard }}
          run-id: 40646817640
          github-token: ${{ github.token }}
          path: backend/reports/mutation
      - name: Retrieve the verified complete seed for files moved between partitions
        if: hashFiles('backend/package-lock.json', 'backend/jest*.cjs', 'backend/tsconfig*.json', 'backend/stryker.config.json', 'backend/test/setup.cjs', 'backend/test/mutation-database-setup.ts', 'backend/test/helpers/**') == '00b7179d7d5c676f361d8c05895cba1b0ce79a88328c7d5bf1708db6a20c6452'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: backend-mutation-verified
          run-id: 40900841329
          github-token: ${{ github.token }}
          path: backend/reports/mutation/seed
      - run: npm run test:mutation:shard -- ${{ matrix.shard }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-${{ matrix.shard }}
          path: backend/reports/mutation/
          if-no-files-found: warn
          retention-days: 14
  mutation-gate:
    needs: [foundation, mutation]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund --strict-peer-deps
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: mutation-*
          path: backend/reports/shards
      - run: npm run test:mutation:merge
      - run: npm run test:mutation:ai-gate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-mutation-verified
          path: backend/reports/mutation/
          if-no-files-found: error
          retention-days: 14
