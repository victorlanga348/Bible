name: Frontend global quality
on:
  push:
    branches: ['feat/biblia-integracao']
    paths: ['frontend/**', 'scripts/**', 'package.json', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['frontend/**', 'scripts/**', 'package.json', '.github/workflows/frontend.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  global-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund --strict-peer-deps
      - run: npm run build
      - run: npm run lint
      - run: npm run test:tooling
      - run: node --test ../scripts/dev.test.cjs
      - run: npm run test:coverage -- --maxWorkers=1
        env:
          BIBLE_STYLE_REPORT: '1'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        id: global-seed
        continue-on-error: true # Missing/expired optimization falls back to full analysis.
        with:
          name: frontend-global-quality
          run-id: 42224340418
          github-token: ${{ github.token }}
          path: frontend/reports/global-seed
      - name: Verify the complete global seed and unchanged toolchain
        if: steps.global-seed.outcome == 'success'
        run: |
          node --input-type=commonjs <<'NODE'
          const { restoreGlobalSeed } = require('./scripts/restore-global-seed.cjs');
          const identities = {
            'package-lock.json': '0d204cf5a64ffe5f99ad523d89f3090bcd9d7600775b640c4352568521b9c868',
            'src/test/evidence-fixtures.ts': 'd4698188974576041667fe04e03abdc5c561f84ebdeb8797274541cea346e994',
            'src/test/fixtures/josephus-pg2848/ai-manifest.json': '46469116db968afc44f32d4e6cc5fecc5890910c038cbaac5363aa80dacb66d4',
            'src/test/fixtures/josephus-pg2848/excerpts.json': '2171bd34f61e74b22d61e58e6c71caa336716b8ad15e2c60f8210ce2e35d7f63',
            'src/test/fixtures/josephus-pg2848/manifest.json': '292fce94d8c1a08dca6b6ff6f5b8fa22d53d40fdd3fde76692e96c9eab03e0a2',
            'src/test/setup.ts': '91a3c8962a0edcb956206a501d943fe99e1c78c6d4d8b5c9a948a3362c75978c',
            'src/test/workflow-fixtures.ts': 'e86e2587634bed7ae2e4ed3d6b8e6a436918a4682a7614aab77550ccce8e8cc8',
            'stryker.config.json': '32f05ff7a3312231b8e8f2cb9c8282c2c50b6d1966316ed8dfc0f5ec7c23f244',
            'tsconfig.app.json': '29c1f3dd12026c2a5604741b4249f12504a8de655531d14b8bdf741226b8a45e',
            'tsconfig.json': '770b4140bbb581e2dfd9ea9946ffc9c75a1d86ba7d2db5f77c83e37cbdf9d808',
            'tsconfig.mutation.json': '4fed69ba6a1b1b43ae824f0af2978d26c8343fba502903111a6356890d19391b',
            'tsconfig.node.json': '38952a786a5ea2e5aafe18d34db62ff241ace6e2790a1333cb2723462db94deb',
            'vitest.config.ts': '983a1f04419b3d9933baea0ce73201dfa172880c5a35165af6b8c5ceac82d80d',
            'vitest.session.config.ts': '8c0e697b281caec63f50c293464924c0e503db1636306d57f0c78bf9478b8093',
            'vitest.transport.config.ts': 'aae5b70daba20f5fdbdbf55149489da0844a07a5a970ccf903ada9c6d93f4ff3',
          };
          const restored = restoreGlobalSeed({ identities,
            reportSha256: '5a25792d3c0ca607d8752342920d85f473ca17c3eddca59a05daf91ac09197c0',
            environmentSha256: '7ae83ffe19f5971f94586f516b8e2ffadc92b83d313ffede1640be124da17c38',
            mutableFiles: 34, mutants: 3037 });
          console.log(restored ? 'Verified full seed and unchanged native environment; original gate FAIL. Current global gate remains mandatory.' : 'Native environment changed: fresh complete analysis required.');
          NODE
      - run: npm run test:mutation:ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: frontend-global-quality
          path: |
            frontend/reports/coverage/global
            frontend/reports/mutation/global
            frontend/reports/native-style-environment.json
          if-no-files-found: error
          retention-days: 7
